<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMS - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .error-message {
            color: var(--danger-color);
            font-weight: bold;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-box card">
            <div style="text-align: center; margin-bottom: 20px;">
                <img src="/assets/logo-placeholder.png" id="loginLogo"
                    style="height: 100px; width: 100px; object-fit: contain; margin-bottom: 10px;">
                <h1 id="loginMosqueName"
                    style="margin: 0; font-size: 24px; line-height: 1.3; word-wrap: break-word; overflow-wrap: break-word;">
                    Mosque Management System</h1>
            </div>
            <h2 style="text-align: center; color: var(--text-color); margin-bottom: 20px;">Portal Login</h2>

            <div id="error" class="error-message">Invalid username or password. Please try again.</div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">SIGN IN</button>
            </form>
            <div style="text-align: right; margin-top: 10px;">
                <a href="#" onclick="showResetForm()" style="color: #888; font-size: 12px;">Forgot Password?</a>
            </div>

            <div id="resetBox" style="display: none; margin-top: 30px; border-top: 1px solid #333; padding-top: 20px;">
                <h3 style="text-align: center;">Reset Password</h3>
                <div class="form-group">
                    <label>Username to Reset</label>
                    <input type="text" id="reset_user" placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label>Super Password</label>
                    <input type="password" id="reset_super" placeholder="Master Key Required">
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="reset_new" placeholder="Min 6 chars">
                </div>
                <button class="btn btn-success" style="width: 100%" onclick="resetPassword()">RESET NOW</button>
                <div style="text-align: center; margin-top: 10px;">
                    <a href="#" onclick="hideResetForm()" style="color: #888; font-size: 12px;">Back to Login</a>
                </div>
            </div>

            <div style="margin-top: 30px; text-align: center;">
                <a href="/" style="color: var(--accent-color); font-size: var(--font-size-base);">Open Live
                    Display (Public)</a>
            </div>

            <div class="developer-footer">
                <p>&copy; 2026 ShakBrotech. Designed & Developed by Shakeel Singalaxana</p>
            </div>
        </div>
    </div>

    <script>
        // Fetch branding settings on load
        async function loadBranding() {
            try {
                const res = await fetch('/api/settings');
                const settings = await res.json();
                if (settings.mosque_name) document.getElementById('loginMosqueName').innerText = settings.mosque_name;
                document.getElementById('loginLogo').src = settings.logo_path || '/assets/img/logo.png';
            } catch (err) { console.error('Failed to load branding'); }
        }
        loadBranding();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                if (data.success) {
                    if (data.user.role === 'super_admin') {
                        window.location.href = '/admin.html';
                    } else {
                        window.location.href = '/accountant.html';
                    }
                } else {
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.innerText = 'Network error. Please check your connection.';
                errorDiv.style.display = 'block';
            }
        });

        function showResetForm() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('resetBox').style.display = 'block';
        }

        function hideResetForm() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('resetBox').style.display = 'none';
        }

        async function resetPassword() {
            const username = document.getElementById('reset_user').value;
            const superPassword = document.getElementById('reset_super').value;
            const newPassword = document.getElementById('reset_new').value;

            if (!username || !superPassword || !newPassword) return alert('Please fill all fields.');

            try {
                const res = await fetch('/api/user/reset-password-super', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, superPassword, newPassword })
                });
                const data = await res.json();
                if (data.success) {
                    alert('Password reset successfully! You can now log in.');
                    hideResetForm();
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (err) { alert('Request failed.'); }
        }
    </script>
</body>

</html>
