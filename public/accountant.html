<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMS - Accountant Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .dashboard-wrapper {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 300px;
            background-color: var(--card-bg);
            border-right: 3px solid var(--accent-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            max-height: 100vh;
        }

        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            background-color: #0c0c0c;
        }

        .nav-item {
            padding: 10px;
            font-size: var(--font-size-large);
            font-weight: bold;
            color: var(--text-color);
            text-decoration: none;
            border-radius: 8px;
            border: 2px solid transparent;
        }

        .nav-item:hover {
            background-color: #333;
            border-color: var(--accent-color);
        }

        .nav-item.active {
            background-color: var(--accent-color);
            color: #000;
        }

        .stat-card {
            text-align: center;
        }

        .stat-value {
            font-size: 48px;
            font-weight: bold;
            margin-top: 10px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 2px solid #333;
            font-size: 20px;
        }

        th {
            color: var(--accent-color);
        }

        .receipt-preview {
            background: white;
            color: black;
            padding: 40px;
            width: 500px;
            margin: 0 auto;
            border: 1px solid #ccc;
            position: relative;
        }
    </style>
</head>

<body>
    <div class="branded-header" id="mainHeader">
        <div class="brand-section">
            <img src="/assets/logo-placeholder.png" alt="Mosque Logo" class="mosque-logo" id="headerLogo">
            <div class="mosque-info">
                <h1 id="headerMosqueName">Loading...</h1>
                <div class="mosque-detail-text" id="headerDetails">...</div>
            </div>
        </div>
        <div class="header-controls">
            <div class="db-status" id="dbStatus" onclick="triggerSync()" style="cursor: pointer;"
                title="Click to forced sync">
                <div class="status-dot" id="dbStatusDot"></div>
                <span id="dbStatusText">Checking DB...</span>
            </div>
        </div>
    </div>
    <div class="dashboard-wrapper">
        <div class="sidebar no-print">
            <h2 style="color: var(--accent-color); text-align: center; margin-bottom: 30px;">MMS MENU</h2>
            <a href="#" class="nav-item active" onclick="loadView('dashboard', this)">DASHBOARD</a>
            <a href="#" class="nav-item" onclick="loadView('members', this)">MEMBERS</a>
            <a href="#" class="nav-item" onclick="loadView('finances', this)">FINANCES</a>
            <a href="#" class="nav-item" onclick="loadView('bills', this)">BILLS</a>
            <a href="#" class="nav-item" onclick="loadView('distributions', this)">DISTRIBUTIONS</a>
            <a href="#" class="nav-item" onclick="loadView('receipts', this)">RECEIPTS</a>
            <a href="#" class="nav-item" onclick="loadView('password', this)">PASSWORD</a>
            <div style="margin-top: auto; padding: 20px;">
                <button class="btn btn-danger" style="width: 100%;" onclick="logout()">LOGOUT</button>
                <div class="developer-footer" style="border: none; padding: 10px 0 0 0;">
                    <p style="font-size: 12px;">&copy; 2026 ShakBrotech</p>
                    <p style="font-size: 11px;">
                        <a href="https://github.com/Shakeel-Singalaxana/MosqueManagementSystem"
                            target="_blank">GitHub</a> |
                        <a href="mailto:shefazslaxana@outlook.com">Email</a>
                    </p>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div id="app">
                <!-- Views will be loaded here -->
                <h1>Loading Dashboard...</h1>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="js/accountant.js"></script>
    <script>
        // Inline script to handle header updates similar to admin.html
        async function updateHeader() {
            try {
                const res = await fetch('/api/settings');
                const s = await res.json();
                if (s.mosque_name) document.getElementById('headerMosqueName').innerText = s.mosque_name;
                document.getElementById('headerLogo').src = s.logo_data || s.logo_path || '/assets/logo-placeholder.png';

                const details = [];
                if (s.mosque_phone) details.push(`Tel: ${s.mosque_phone}`);
                if (s.mosque_address) details.push(s.mosque_address);
                document.getElementById('headerDetails').innerText = details.join(' | ');
            } catch (e) { console.error('Header update failed', e); }
        }
        updateHeader();
    </script>
</body>

</html>
