<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMS - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .error-message {
            color: var(--danger-color);
            font-weight: bold;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box card">
            <h1 style="text-align: center;">Mosque Management System</h1>
            <h2 style="text-align: center; color: var(--text-color);">Portal Login</h2>
            
            <div id="error" class="error-message">Invalid username or password. Please try again.</div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">SIGN IN</button>
            </form>

            <div style="margin-top: 30px; text-align: center;">
                <a href="/live.html" style="color: var(--accent-color); font-size: var(--font-size-base);">Open Live Display (Public)</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                if (data.success) {
                    if (data.user.role === 'super_admin') {
                        window.location.href = '/admin.html';
                    } else {
                        window.location.href = '/accountant.html';
                    }
                } else {
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.innerText = 'Network error. Please check your connection.';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
